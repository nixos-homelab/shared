name: Lock images

# Dependabot bumps what names the images of lib.images.locked and chart in
# flake.lock (a chart, k8sss), and the sources pinned in pins.yaml; this
# commits the matching images.lock and pins.lock to its branch
on:
  pull_request:
    paths: ['flake.lock', '.github/workflows/pins.yaml']

# The push goes through LOCK_IMAGES_TOKEN (a PAT with contents: write), as a
# push with GITHUB_TOKEN starts no workflow runs on the new commit
permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.head_ref }}
        token: ${{ secrets.LOCK_IMAGES_TOKEN }}
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: experimental-features = nix-command flakes
    - name: Lock the images
      run: nix run .#lock-images
    - name: Commit the locks
      run: |
        git diff --quiet && exit
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -am 'images: Lock the bumped images'
        git push
