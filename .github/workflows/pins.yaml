name: Pins

# Never runs. Dependabot's github-actions ecosystem bumps the refs below
# (repositories without an action.yml too), which lib.pins.refs reads: sources
# that are neither images nor flake inputs, their hashes in ../pins.lock
on: workflow_dispatch

permissions: {}

jobs:
  pins:
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: kubernetes-sigs/gateway-api@v1.7.0
    # No tags: Dependabot follows the latest commit
    - uses: yannh/kubernetes-json-schema@2bfaff3898a7a4fa4e4760da3d2656211c9b4c71
